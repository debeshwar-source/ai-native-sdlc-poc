# Self-contained hardcoded-secret rules for tools/static_analysis.py.
#
# Semgrep's own free-tier `p/secrets` registry config turns out to
# need `semgrep login` for its real (entropy/provider-validated)
# secret rules -- anonymously it's ~37 generic community rules that,
# verified by hand, do NOT catch something as basic as a hardcoded AWS
# access key. Shipping our own small, well-known-token-format ruleset
# keeps the "near-zero false positive, therefore force-blocking"
# guarantee agents/review.py relies on fully self-contained: no
# network dependency, no external account, no silently-weaker
# anonymous tier.
#
# Deliberately limited to distinctive, fixed TOKEN FORMATS (not things
# like a generic `password = "..."` assignment, which has a real
# false-positive rate against test fixtures/config examples).

rules:
  - id: hardcoded-aws-access-key-id
    languages: [generic]
    severity: ERROR
    message: Hardcoded AWS Access Key ID.
    patterns:
      - pattern-regex: '(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'

  - id: hardcoded-github-token
    languages: [generic]
    severity: ERROR
    message: Hardcoded GitHub token.
    patterns:
      - pattern-regex: 'gh[pousr]_[A-Za-z0-9]{36,255}'

  - id: hardcoded-slack-token
    languages: [generic]
    severity: ERROR
    message: Hardcoded Slack token.
    patterns:
      - pattern-regex: 'xox[baprs]-[0-9A-Za-z-]{10,72}'

  - id: hardcoded-private-key
    languages: [generic]
    severity: ERROR
    message: Hardcoded private key material.
    patterns:
      - pattern-regex: '-----BEGIN\s?(RSA|EC|DSA|OPENSSH)?\s?PRIVATE KEY-----'

  - id: hardcoded-stripe-key
    languages: [generic]
    severity: ERROR
    message: Hardcoded Stripe API key.
    patterns:
      - pattern-regex: '(sk|rk)_(live|test)_[A-Za-z0-9]{16,247}'
